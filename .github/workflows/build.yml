name: build

on:
  schedule:
    - cron: "17 5 * * *"      # 每天 05:17 UTC 探一次
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - .github/workflows/build.yml

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # 第一遍：只为拿到“这个 Dockerfile 现在装出来的组件版本”
      - name: Probe build (not pushed)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: nginx-with-extras:candidate

      - name: Collect component versions
        id: comps
        run: |
          set -e
          docker run --rm nginx-with-extras:candidate sh -c 'apk info -v' \
            | grep -E '^(nginx|nginx-mod-http-(dav-ext|headers-more|xslt-filter)|ca-certificates|tzdata)-[0-9]' \
            | sort > /tmp/components.txt
          cat /tmp/components.txt
          echo "digest=$( { cat /tmp/components.txt; sha256sum Dockerfile; } | sha256sum | cut -d' ' -f1 )" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y.%m.%d)" >> "$GITHUB_OUTPUT"
          # OCI label 的值：name-version，逗号分隔
          echo "components=$(paste -sd, /tmp/components.txt)" >> "$GITHUB_OUTPUT"

      - name: Compare with last build
        id: diff
        run: |
          prev=""
          cid=$(docker create ghcr.io/${{ github.repository }}:latest 2>/dev/null || true)
          if [ -n "$cid" ]; then
            prev=$(docker inspect --format '{{index .Config.Labels "io.wannaknowhys.digest"}}' "$cid" 2>/dev/null || true)
            docker rm -f "$cid" >/dev/null 2>&1 || true
          fi
          if [ "$prev" = "${{ steps.comps.outputs.digest }}" ]; then
            echo "组件无变化，跳过推送"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Login to GHCR
        if: steps.diff.outputs.changed == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 第二遍：带上 label 真正推送。层缓存命中，只多几秒。
      - name: Build and push (with component labels)
        if: steps.diff.outputs.changed == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          labels: |
            org.opencontainers.image.title=nginx-with-extras
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.comps.outputs.date }}
            io.wannaknowhys.build-date=${{ steps.comps.outputs.date }}
            io.wannaknowhys.digest=${{ steps.comps.outputs.digest }}
            io.wannaknowhys.components=${{ steps.comps.outputs.components }}
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ steps.comps.outputs.date }}
