name: build

on:
  schedule:
    - cron: "17 5 * * *"      # 每天 05:17 UTC 探一次
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - .github/workflows/build.yml

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # 第一遍：构建候选镜像以提取版本与摘要
      - name: Probe build (not pushed)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: nginx-with-extras:candidate

      - name: Collect component versions
        id: comps
        run: |
          set -e
          # 从纯静态二进制读取 nginx 版本（输出至 stderr，形如 "nginx version: nginx/1.27.x"）
          ver=$(docker run --rm nginx-with-extras:candidate /usr/sbin/nginx -v 2>&1 | awk -F'/' '{print $2}' | tr -d ' \r\n')
          echo "nginx_version=${ver}"
          echo "nginx=${ver}" > /tmp/components.txt
          sha256sum Dockerfile >> /tmp/components.txt
          cat /tmp/components.txt
          echo "digest=$(sha256sum /tmp/components.txt | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y.%m.%d)" >> "$GITHUB_OUTPUT"
          echo "components=nginx-${ver}" >> "$GITHUB_OUTPUT"

      - name: Compare with last build
        id: diff
        run: |
          prev=""
          cid=$(docker create ghcr.io/${{ github.repository }}:latest 2>/dev/null || true)
          if [ -n "$cid" ]; then
            prev=$(docker inspect --format '{{index .Config.Labels "io.wannaknowhys.digest"}}' "$cid" 2>/dev/null || true)
            docker rm -f "$cid" >/dev/null 2>&1 || true
          fi
          # 如果 digest 改变，或由 push / manual 触发，则执行推送
          if [ "$prev" != "${{ steps.comps.outputs.digest }}" ] || [ "${{ github.event_name }}" = "push" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Build targets updated or manual/push triggered, proceeding with push"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "Components unchanged, skipping push"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Login to GHCR
        if: steps.diff.outputs.changed == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 第二遍：打上 OCI 标签推送到 GHCR
      - name: Build and push (with component labels)
        if: steps.diff.outputs.changed == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          labels: |
            org.opencontainers.image.title=nginx-with-extras
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.comps.outputs.date }}
            io.wannaknowhys.build-date=${{ steps.comps.outputs.date }}
            io.wannaknowhys.digest=${{ steps.comps.outputs.digest }}
            io.wannaknowhys.components=${{ steps.comps.outputs.components }}
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ steps.comps.outputs.date }}
